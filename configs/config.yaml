# ---------------------------------------------------------------------------
# llm-bot 配置文件
# 所有可调参数都集中在这里，代码中禁止出现硬编码的连接串、密钥或阈值。
# ---------------------------------------------------------------------------

# HTTP / WebSocket 服务端配置：NapCatQQ 通过反向 WS 连接到这里
server:
  addr: ":8080"              # 监听地址
  ws_path: "/onebot/v11"     # 反向 WS 的路径，需与 NapCat 配置一致
  access_token: ""           # NapCat 的 access_token，留空则不校验

# Redis：用于持久化对话历史、stats 与主动消息运行期状态
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# 主对话模型（兼容 OpenAI 协议的一切：OpenAI、DeepSeek、OneAPI、Moonshot ...)
llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key:  ""               # 生产环境用环境变量覆盖：LLMBOT_LLM_API_KEY
  model:    "deepseek-v4-flash"
  timeout_sec: 30

# 提示词注入裁判模型（独立于主模型，选小而便宜的）
judge:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key:  ""
  model:    "qwen-flash"
  timeout_sec: 10

# Agent 业务参数
agent:
  history_size: 100                               # 单会话保留的最近历史条数
  prompt_file:  "configs/prompts/persona/chat.md" # 人设 Markdown 文件路径

# 提示词注入防护：前置 LLM 裁判固定启用，只有明确输出 safe 才进入主链。
guard:
  # 裁判输出非 safe（含 attack、未知输出、请求失败）都会静默不回复。
  judge_prompt_file: "configs/prompts/guard/judge.md"

# 触发规则：Adapter 标记显式触发，并保留群聊普通文本供后续跟进判断。
trigger:
  private:            true        # 私聊消息一律触发
  prefix:             ["/bot"]    # 显式前缀（群聊可绕过 @ 限制）
  group_followup_sec: 30          # 群聊普通消息跟进窗口；<=0 表示关闭

# 群聊短期上下文缓存：保存最近若干条普通群消息（不进历史也不入个人上下文），
# 仅用于 @bot 时作为"刚才大家在聊什么"的背景注入。
# Redis 写入侧靠 LPUSH+LTRIM+EXPIRE 自然控制规模；读取侧不再叠加任何过滤。
group_buffer:
  enabled:      true
  max_messages: 20      # 单群最多保留 20 条普通消息
  ttl_sec:      600     # 每次写入后刷新 10 分钟过期

# 黑名单：命中后在 Adapter 源头忽略，不进入历史、stats 或 LLM 调用。
blacklist:
  user_ids:
    - "2854196310" # Q群管家

# 日志级别：debug / info / warn / error
log:
  level: "info"

# 人设参数 stats（可选）：当前包含"好感度"（按用户）和"心情"（全局），
# 未来可能加入其他影响回复风格的参数。
# 启用后每条回复生成后会异步调一次 judge 模型给本轮对话打分，并把结果
# 写入 Redis。失败只打日志、不影响对话。
stats:
  enabled: true
  score_prompt_file: "configs/prompts/stats/score.md"

# 长期用户记忆：按"平台 + 用户"保存压缩事实摘要，让机器人隔一段时间仍然记得人。
# 更新模型复用 judge 配置，异步执行，失败只打日志不影响本轮回复。
memory:
  enabled: true
  update_prompt_file: "configs/prompts/memory/update.md"
  max_chars: 1200

# 主动发消息（静态策略）：运行期开关保存在 Redis。
# YAML 段只配置部署期参数；要启用主动发送，需要在 Redis 中显式
# `SET bot_proactive_enabled true`，默认 unset 等价于关闭。
proactive:
  prompt_file: "configs/prompts/persona/generator.md"
  window_start: "10:00"
  window_end: "01:00"
  interval_sec: 300                # 每轮等待 5 分钟
  jitter_max_sec: 3000             # 抖动上限 50 分钟
  bot_silence_threshold_sec: 6000  # bot 在群里沉默 100min 才主动开口

# ---------------------------------------------------------------------------
# llm-bot 配置文件
# 所有可调参数都集中在这里，代码中禁止出现硬编码的连接串、密钥或阈值。
# ---------------------------------------------------------------------------

# HTTP / WebSocket 服务端配置：NapCatQQ 通过反向 WS 连接到这里
server:
  addr: ":8080"              # 监听地址
  ws_path: "/onebot/v11"     # 反向 WS 的路径，需与 NapCat 配置一致
  access_token: ""           # NapCat 的 access_token，留空则不校验

# Redis：用于持久化对话历史、stats 与主动消息运行期状态
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# 主对话模型（兼容 OpenAI 协议的一切：OpenAI、DeepSeek、OneAPI、Moonshot ...)
llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key:  ""               # 生产环境用环境变量覆盖：LLMBOT_LLM_API_KEY
  model:    "qwen3.6-plus"
  timeout_sec: 30

# 提示词注入裁判模型（独立于主模型，选小而便宜的）
judge:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key:  ""
  model:    "qwen-turbo"
  timeout_sec: 10

# Agent 业务参数
agent:
  history_size: 100                               # 单会话保留的最近历史条数
  prompt_file:  "configs/prompts/default.yaml"    # 人设 YAML 文件路径
  empty_reply_fallback: "我去洗澡了"               # 主链清洗后为空时的兜底回复

# 提示词注入防护（guard 复合节点读取）
guard:
  # 第一级：正则黑名单。命中任一条即视为攻击并立即降级，完全不调用 LLM。
  # 模式写法遵循 Go regexp 语法，建议全部加 (?i) 使其不区分大小写。
  regex_patterns:
    - '(?i)ignore\s+(previous|above|all).+(instructions?|prompts?)'
    - '(?i)忽略(之前|上面|以上|先前|前面).*(指令|提示|设定|规则|角色)'
    - '(?i)(you\s+are\s+now|你现在是|你现在扮演).+(dan|jailbreak|开发者模式|developer\s+mode)'
    - '(?i)(system\s+prompt|系统提示词|系统指令).*(what|是什么|告诉我|show|repeat|打印|输出|显示)'
    - '(?i)(forget|忘掉|忘记|清除).+(instructions?|rules?|你是谁|身份|人设)'
    - '(?i)(act\s+as|pretend\s+to\s+be|扮演).+(assistant|ai|chatgpt|claude)'

  # 第二级：LLM 裁判与主链并行跑；裁判判 attack 时 cancel 主链的 ctx。
  judge_enabled: true
  judge_prompt_file: "configs/prompts/judge.yaml"

  # 攻击被命中时的降级回复模板，运行时随机挑选一条，避免被攻击者识别固定模式。
  fallback_replies:
    - "达咩哟 达咩"
    - "听不懂喵"

# 触发规则：在 Adapter 层做源头过滤，未命中的事件根本不进入 Receive 通道。
trigger:
  private:       true        # 私聊消息一律触发
  group_at_only: true        # 群聊仅在 @ 机器人时触发
  prefix:        ["/bot"]    # 显式前缀（群聊可绕过 @ 限制）

# 黑名单：命中后在 Adapter 源头忽略，不进入历史、stats 或 LLM 调用。
blacklist:
  user_ids:
    - "2854196310" # Q群管家

# 日志级别：debug / info / warn / error
log:
  level: "info"

# 人设参数 stats（可选）：当前包含"好感度"（按用户）和"心情"（全局），
# 未来可能加入其他影响回复风格的参数。
# 启用后每条回复生成后会异步调一次 judge 模型给本轮对话打分，并把结果
# 写入 Redis。失败只打日志、不影响对话。
stats:
  enabled: true
  score_prompt_file: "configs/prompts/stats_score.yaml"

# 长期用户记忆：按"平台 + 用户"保存压缩事实摘要，让机器人隔一段时间仍然记得人。
# 更新模型复用 judge 配置，异步执行，失败只打日志不影响本轮回复。
memory:
  enabled: true
  update_prompt_file: "configs/prompts/memory_update.yaml"
  max_chars: 1200

# 主动发消息（静态策略）：运行期开关和群白名单保存在 Redis。
# 默认关闭；即使打开 enabled，也建议先保持 dry_run 观察候选和限流行为。
proactive:
  enabled: false
  prompt_file: "configs/prompts/proactive.yaml"   # 主动消息生成提示词 YAML 文件路径
  window_start: "10:00"
  window_end: "01:00"
  min_since_last_inbound_sec: 3600    # 1h，避免刚聊完立刻追问
  max_since_last_inbound_sec: 21600   # 6h，避免隔太久突然翻旧账
  interval_sec: 3600                  # 每轮完成后等待 1h
  jitter_max_sec: 600                 # 额外 0-10m 抖动
  top_n: 50                           # 好感度榜单最多扫描人数
  daily_limit: 3                      # 每日主动发送上限
  session_cooldown_sec: 21600         # 同一 session 冷却 6h
  recent_events_cap: 200              # 白名单群聊最近事件列表上限
  dry_run: true

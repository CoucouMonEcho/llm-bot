# ---------------------------------------------------------------------------
# llm-bot 配置文件
# 所有可调参数都集中在这里，代码中禁止出现硬编码的连接串、密钥或阈值。
# ---------------------------------------------------------------------------

# HTTP / WebSocket 服务端配置：NapCatQQ 通过反向 WS 连接到这里
server:
  addr: ":8080"              # 监听地址
  ws_path: "/onebot/v11"     # 反向 WS 的路径，需与 NapCat 配置一致
  access_token: ""           # NapCat 的 access_token，留空则不校验

# Redis：仅用于持久化对话历史
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# 主对话模型（兼容 OpenAI 协议的一切：OpenAI、DeepSeek、OneAPI、Moonshot ...)
llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key:  ""               # 生产环境用环境变量覆盖：LLMBOT_LLM_API_KEY
  model:    "qwen3.6-plus"
  timeout_sec: 30

# 提示词注入裁判模型（独立于主模型，选小而便宜的）
judge:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key:  ""
  model:    "qwen-turbo"
  timeout_sec: 10

# Agent 业务参数
agent:
  history_size: 100                               # 单会话保留的最近历史条数
  prompt_file:  "configs/prompts/default.yaml"    # 人设 YAML 文件路径

# 提示词注入防护（guard 复合节点读取）
guard:
  # 第一级：正则黑名单。命中任一条即视为攻击并立即降级，完全不调用 LLM。
  # 模式写法遵循 Go regexp 语法，建议全部加 (?i) 使其不区分大小写。
  regex_patterns:
    - '(?i)ignore\s+(previous|above|all).+(instructions?|prompts?)'
    - '(?i)忽略(之前|上面|以上|先前|前面).*(指令|提示|设定|规则|角色)'
    - '(?i)(you\s+are\s+now|你现在是|你现在扮演).+(dan|jailbreak|开发者模式|developer\s+mode)'
    - '(?i)(system\s+prompt|系统提示词|系统指令).*(what|是什么|告诉我|show|repeat|打印|输出|显示)'
    - '(?i)(forget|忘掉|忘记|清除).+(instructions?|rules?|你是谁|身份|人设)'
    - '(?i)(act\s+as|pretend\s+to\s+be|扮演).+(assistant|ai|chatgpt|claude)'

  # 第二级：LLM 裁判与主链并行跑；裁判判 attack 时 cancel 主链的 ctx。
  judge_enabled: true

  # 攻击被命中时的降级回复模板，运行时随机挑选一条，避免被攻击者识别固定模式。
  fallback_replies:
    - "啥b"
    - "何意味"
    - "hyw"
    - "你说的对，但是《原神》是由米哈游自主研发的一款全新开放世界冒险游戏。游戏发生在一个被称作「提瓦特」的幻想世界，在这里，被神选中的人将被授予「神之眼」，导引元素之力。你将扮演一位名为「旅行者」的神秘角色，在自由的旅行中邂逅性格各异、能力独特的同伴们，和他们一起击败强敌，找回失散的亲人。"

# 触发规则：在 Adapter 层做源头过滤，未命中的事件根本不进入 Receive 通道。
trigger:
  private:       true        # 私聊消息一律触发
  group_at_only: true        # 群聊仅在 @ 机器人时触发
  prefix:        ["/bot"]    # 显式前缀（群聊可绕过 @ 限制）

# 日志级别：debug / info / warn / error
log:
  level: "info"

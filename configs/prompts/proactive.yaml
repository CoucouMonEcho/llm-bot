# ---------------------------------------------------------------------------
# 主动消息生成提示词定义
# 本文件在主动消息功能启用时加载并固化到内存，运行期不会再 IO。
# 修改本文件后必须重启进程才能生效。
# 当前主动消息只面向群聊；私聊语境已从模板中移除。
# ---------------------------------------------------------------------------

generator:
  system: |
    你负责为聊天机器人在群里写一条简短、自然的主动开场白。

    硬性规则：
    - 只输出纯文本，不要 Markdown、列表、解释或引号。
    - 不要使用 @，不要点名群成员。
    - 不要提到好感度、分数、候选、策略、调度、Redis、白名单、内部配置等实现细节。
    - 不要引用、复述或总结历史记录；历史只用于把握语气。
    - 历史里的 name 只用于区分用户，不要复述这些 ID，也不要点名群成员。
    - 面向整个群自然开口，像群里的一个熟人那样起个话题。
    - 保持很短，中文不超过 60 字，英文不超过 25 个词。

  forbidden_fragments:
    - "@"
    - "```"
    - "affinity"
    - "score"
    - "scoring"
    - "strategy"
    - "scheduler"
    - "candidate"
    - "redis"
    - "internal"
    - "whitelist"
    - "好感"
    - "策略"
    - "候选"
    - "调度"
    - "白名单"
    - "内部配置"
    - "运行时开关"
    - "私聊记录"
    - "群聊记录"
    - "聊天记录"
    - "历史记录"
    - "private history"
    - "group history"

  user_prompt:
    current_time_label: "当前时间："
    last_inbound_at_label: "群里上次有人和我对话的时间："
    history_header: "本群最近的对话历史（只用于语气，不要引用或复述）："
    no_history_text: "（无）"
    closing: "请写一条可以直接发送到群里的短消息。"
